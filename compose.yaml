name: marengo
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-app: &app
  image: marengo-portal:local
  build: .
  env_file: .env
  environment: &environment
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '4000'
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    NODE_OPTIONS: --max-old-space-size=4096
    UV_THREADPOOL_SIZE: '4'
    CHROMIUM_NO_SANDBOX: 'true'
  init: true
  logging: *logging

services:
  migrate:
    <<: *app
    command: [node, scripts/migrate-deploy.cjs]
    restart: 'no'
    mem_limit: 1g
  # One image, three roles (server/processRole.ts). All three share the uploads volume, so they must run on
  # the same host: study ZIPs and report files are handed between them on that disk.
  api:
    <<: *app
    environment:
      <<: *environment
      PROCESS_ROLE: api
      NODE_OPTIONS: --max-old-space-size=1536
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: [uploads:/app/uploads]
    ports: ['127.0.0.1:4000:4000']
    healthcheck: &healthcheck
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 2g
    cpus: 1.0
    shm_size: 256m
  # DICOM receivers, inbound scan and Bridge endpoints. One copy: fixed DICOM ports and in-memory commit guards.
  ingest:
    <<: *app
    environment:
      <<: *environment
      PROCESS_ROLE: ingest
      NODE_OPTIONS: --max-old-space-size=1024
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: [uploads:/app/uploads]
    healthcheck: *healthcheck
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 1536m
    cpus: 0.5
  # Submission, dispatch, PACS return, recovery, messaging, invoices, viewer pre-import. One copy only.
  worker:
    <<: *app
    environment:
      <<: *environment
      PROCESS_ROLE: worker
      NODE_OPTIONS: --max-old-space-size=2048
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: [uploads:/app/uploads]
    healthcheck: *healthcheck
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 2560m
    cpus: 1.0
    shm_size: 256m
  web:
    image: caddy:2-alpine
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set PORTAL_DOMAIN in .env}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: {condition: service_healthy}
      ingest: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.25
    logging: *logging
volumes:
  uploads:
  caddy-data:
  caddy-config:
