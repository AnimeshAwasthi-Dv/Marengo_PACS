name: marengo
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-app: &app
  image: marengo-portal:local
  build: .
  env_file: .env
  environment: &environment
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '4000'
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    NODE_OPTIONS: --max-old-space-size=4096
    UV_THREADPOOL_SIZE: '4'
    CHROMIUM_NO_SANDBOX: 'true'
  init: true
  logging: *logging

services:
  migrate:
    <<: *app
    command: [node, scripts/migrate-deploy.cjs]
    restart: 'no'
    mem_limit: 1g
  app:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: [uploads:/app/uploads]
    ports: ['127.0.0.1:4000:4000']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: 6g
    cpus: 2.5
    shm_size: 256m
  web:
    image: caddy:2-alpine
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?Set PORTAL_DOMAIN in .env}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.25
    logging: *logging
volumes:
  uploads:
  caddy-data:
  caddy-config:
